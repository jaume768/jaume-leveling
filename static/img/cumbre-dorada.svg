  <path d="M333 70 L322 100 L308 118 L296 150 L278 182 L262 240 L190 240 L270 150 L300 118 Z" fill="url(#luz)" opacity="0.95"/>
  <path d="M333 70 L341 96 L336 122 L346 150 L338 190 L350 240 L300 240 L312 190 L306 150 L318 120 L322 100 Z" fill="#f5b04a" opacity="0.35"/>

