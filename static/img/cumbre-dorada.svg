<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 240" preserveAspectRatio="xMaxYMax slice" role="img" aria-hidden="true">
  <defs>
    <radialGradient id="halo" cx="0.64" cy="0.28" r="0.5">
      <stop offset="0%" stop-color="#ffb13b" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#d9771c" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#d9771c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="luz" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd27a"/>
