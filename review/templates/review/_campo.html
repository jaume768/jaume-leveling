<div>
  <div class="flex items-baseline justify-between gap-2">
    <label for="{{ campo.id_for_label }}" class="text-sm text-slate-300">{{ campo.label }}</label>
    {% if semaforo %}
      <span class="h-2 w-2 shrink-0 rounded-full
        {% if semaforo == 'verde' %}bg-emerald-400{% elif semaforo == 'ambar' %}bg-amber-400{% elif semaforo == 'rojo' %}bg-red-400{% else %}bg-slate-600{% endif %}"
        title="{% if semaforo == 'verde' %}En objetivo{% elif semaforo == 'ambar' %}Encaminada{% elif semaforo == 'rojo' %}Fuera de objetivo{% else %}Sin objetivo{% endif %}"></span>
    {% endif %}
  </div>
  <div class="mt-1">{{ campo }}</div>
  {% if campo.help_text %}<p class="mt-1 text-xs text-slate-500">{{ campo.help_text }}</p>{% endif %}
  {% for error in campo.errors %}<p class="mt-1 text-xs text-red-400">{{ error }}</p>{% endfor %}
</div>
