<div>
  <div class="flex items-baseline justify-between gap-2">
    <label for="{{ campo.id_for_label }}" class="text-body-sm text-ink-2">{{ campo.label }}</label>
    {% if semaforo %}
      <span class="h-2 w-2 shrink-0 rounded-full
        {% if semaforo == 'verde' %}bg-ok{% elif semaforo == 'ambar' %}bg-warn{% elif semaforo == 'rojo' %}bg-bad{% else %}bg-surface-3{% endif %}"
        title="{% if semaforo == 'verde' %}En objetivo{% elif semaforo == 'ambar' %}Encaminada{% elif semaforo == 'rojo' %}Fuera de objetivo{% else %}Sin objetivo{% endif %}"></span>
    {% endif %}
  </div>
  <div class="mt-1">{{ campo }}</div>
  {% if campo.help_text %}<p class="mt-1 text-caption text-ink-3">{{ campo.help_text }}</p>{% endif %}
  {% for error in campo.errors %}<p class="mt-1 text-caption text-bad">{{ error }}</p>{% endfor %}
</div>
