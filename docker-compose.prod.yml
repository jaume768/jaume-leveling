# Producción: web (gunicorn) + db + caddy (HTTPS automático).
# Uso: docker compose -f docker-compose.prod.yml <comando>
# Lo habitual es no llamarlo a mano, sino con ./deploy.sh

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sistema}
      POSTGRES_USER: ${POSTGRES_USER:-sistema}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sistema} -d ${POSTGRES_DB:-sistema}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: always
    # Sin `ports`: la base de datos no se publica al exterior. Solo la ve web.

  web:
    build:
      context: .
      target: runtime
    command: >
      gunicorn sistema.wsgi:application
      --bind 0.0.0.0:8000
      --workers 3
      --timeout 60
      --access-logfile -
      --error-logfile -
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: sistema.settings.prod
    volumes:
      - staticfiles:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    restart: always
    # Sin `ports`: solo caddy habla con web. Nada escucha en el host salvo caddy.

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMINIO: ${DOMINIO:-jaumeleveling.com}
      ACME_EMAIL: ${ACME_EMAIL:?falta ACME_EMAIL en .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: always

volumes:
  pgdata:
  staticfiles:
  caddy_data:
  caddy_config:
