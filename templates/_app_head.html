{% load static %}
{# Lo que convierte la web en app instalable. Va en el <head> de cada pagina completa. #}
<link rel="manifest" href="{% url 'manifiesto' %}">
<link rel="icon" type="image/png" href="{% static 'img/app/favicon-32.png' %}">
<link rel="apple-touch-icon" href="{% static 'img/app/apple-touch-icon.png' %}">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Leveling">
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("{% url 'service_worker' %}"));
  }
</script>
