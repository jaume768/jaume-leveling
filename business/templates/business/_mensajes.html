{% if messages %}
  <div class="mb-4 space-y-2">
    {% for mensaje in messages %}
      <p class="rounded-md border px-3 py-2 text-body-sm
        {% if mensaje.level_tag == 'warning' %}border-warn/35 bg-warn/10 text-ink-2
        {% elif mensaje.level_tag == 'error' %}border-bad/45 bg-bad/10 text-ink-2
        {% else %}border-line bg-surface-2 text-ink-2{% endif %}">{{ mensaje }}</p>
    {% endfor %}
  </div>
{% endif %}
