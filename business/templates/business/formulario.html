{% extends "base.html" %}
{% block title %}{{ titulo }}{% endblock %}
{% block content %}
<div class="mx-auto max-w-2xl">
  <h1 class="text-2xl font-semibold text-slate-100">{{ titulo }}</h1>
  <form method="post" class="mt-6 space-y-4 rounded-lg border border-slate-800 bg-slate-900 p-5">
    {% csrf_token %}
    {% for campo in form %}{% include "business/_campo.html" with campo=campo %}{% endfor %}
    <div class="flex justify-end gap-2 pt-2">
      <a href="{{ volver }}" class="rounded-md border border-slate-700 px-3 py-1.5 text-sm text-slate-400 hover:bg-slate-800">Cancelar</a>
      <button type="submit" class="rounded-md bg-slate-200 px-3 py-1.5 text-sm font-medium text-slate-900 hover:bg-white">Guardar</button>
    </div>
  </form>
</div>
{% endblock %}
