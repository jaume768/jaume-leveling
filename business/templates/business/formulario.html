{% extends "base.html" %}
{% block title %}{{ titulo }}{% endblock %}
{% block encabezado %}{{ titulo }}{% endblock %}
{% block content %}
<div class="mx-auto max-w-2xl">
  <form method="post" class="space-y-4 card p-5">
    {% csrf_token %}
    {% for campo in form %}{% include "business/_campo.html" with campo=campo %}{% endfor %}
    <div class="flex justify-end gap-2 pt-2">
      <a href="{{ volver }}" class="btn">Cancelar</a>
      <button type="submit" class="btn-xp">Guardar</button>
    </div>
  </form>
</div>
{% endblock %}
