{% load l10n %}
{% comment %}
  El mapa de atributos. Recibe `radar` (las coordenadas ya resueltas en
  services.radar_de_atributos) y `sufijo`, que hace unico el id del degradado:
  en la pagina hay dos mapas y uno de ellos siempre esta oculto.
{% endcomment %}
{% localize off %}
<svg class="radar mt-2" viewBox="0 0 {{ radar.ancho }} {{ radar.alto }}"
     role="img" aria-label="Los quince atributos, cada radio uno">
  <defs>
    <radialGradient id="relleno-radar-{{ sufijo }}" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="var(--color-xp)" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="var(--color-xp)" stop-opacity="0.12"/>
    </radialGradient>
  </defs>

  {# La telaraña: cuatro anillos y un eje por atributo. #}
  <g class="text-line" stroke="currentColor" stroke-width="1" fill="none" opacity="0.75">
    {% for anillo in radar.anillos %}
      <polygon points="{{ anillo }}"/>
    {% endfor %}
    {% for eje in radar.ejes %}
      <line x1="{{ radar.centro_x }}" y1="{{ radar.centro_y }}"
            x2="{{ eje.x }}" y2="{{ eje.y }}"/>
    {% endfor %}
  </g>

  <polygon points="{{ radar.poligono }}" fill="url(#relleno-radar-{{ sufijo }})"
           stroke="var(--color-xp)" stroke-width="2.5" stroke-linejoin="round"/>

  {% for v in radar.vertices %}
    <circle cx="{{ v.x }}" cy="{{ v.y }}" r="{% if radar.compacto %}3.5{% else %}4.5{% endif %}"
            class="{% if v.estado.acento == 'ok' %}fill-ok{% elif v.estado.acento == 'warn' %}fill-warn{% else %}fill-bad{% endif %}"/>
  {% endfor %}

  {% if radar.compacto %}
    {# El valor abre la primera linea; el nombre sigue y, si es largo, baja a la segunda. #}
    {% for e in radar.etiquetas %}
      {% for linea in e.lineas %}
        <text x="{{ e.x }}" y="{{ linea.y }}" text-anchor="{{ e.ancla }}"
              dominant-baseline="middle" class="fill-ink-2"
              style="font-size: 10.5px">{% if forloop.first %}<tspan
              style="font-size: 13px; font-weight: 700"
              class="{% if e.estado.acento == 'ok' %}fill-ok{% elif e.estado.acento == 'warn' %}fill-warn{% else %}fill-bad{% endif %}">{{ e.atributo.valor }}</tspan> {% endif %}{{ linea.texto }}</text>
      {% endfor %}
    {% endfor %}
  {% else %}
    {% comment %}
      El nombre y el valor van en una sola linea: con quince radios,
      dos lineas por etiqueta se pisarian arriba y abajo.
    {% endcomment %}
    {% for e in radar.etiquetas %}
      <text x="{{ e.x }}" y="{{ e.y }}" text-anchor="{{ e.ancla }}"
            dominant-baseline="middle" class="fill-ink-2"
            style="font-size: 12px">{{ e.atributo.nombre }} <tspan
            style="font-size: 14px; font-weight: 700"
            class="{% if e.estado.acento == 'ok' %}fill-ok{% elif e.estado.acento == 'warn' %}fill-warn{% else %}fill-bad{% endif %}">{{ e.atributo.valor }}</tspan></text>
    {% endfor %}
  {% endif %}
</svg>
{% endlocalize %}
