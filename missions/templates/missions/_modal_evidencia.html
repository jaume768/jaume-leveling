{# Modal pequeño: la misión no se da por hecha sin evidencia. #}
<div class="fixed inset-0 z-40 flex items-end justify-center bg-base/80 p-4 backdrop-blur-sm sm:items-center"
     hx-on:click="if (event.target === this) htmx.ajax('GET', '{% url 'missions:cerrar_modal' %}', '#modal')">
  <div class="card w-full max-w-md p-5">
    <p class="label">Evidencia requerida</p>
    <h3 class="mt-1 text-h4 font-semibold text-ink">{{ mision.titulo }}</h3>
    <p class="mt-1 text-caption text-ink-3">{{ mision.definicion_terminada }}</p>

    <form hx-post="{% url 'missions:completar' mision.pk %}"
          hx-target="#bloque-misiones"
          hx-swap="outerHTML"
          hx-on::after-request="htmx.ajax('GET', '{% url 'missions:cerrar_modal' %}', '#modal')">
      {% csrf_token %}
      <input type="hidden" name="minimo" value="{% if modo_minimo %}1{% else %}0{% endif %}">

      <label for="evidencia" class="mt-5 block text-body-sm font-medium text-ink-2">
        Qué has hecho exactamente
      </label>
      <textarea id="evidencia" name="evidencia" rows="3" required autofocus
                placeholder="A quién, qué le has dicho, dónde queda anotado"
                class="mt-2 w-full rounded-sm border border-line bg-base p-3 text-body-sm text-ink
                       placeholder:text-ink-3 focus:border-xp focus:outline-none"></textarea>

      <div class="mt-5 flex justify-end gap-2">
        <button type="button" class="btn"
                hx-get="{% url 'missions:cerrar_modal' %}"
                hx-target="#modal"
                hx-swap="innerHTML">Cancelar</button>
        <button type="submit" class="btn-xp">Completar</button>
      </div>
    </form>
  </div>
</div>
